[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.13"
]
build-backend = "scikit_build_core.build"

[project]
name = "pymcpp"
version = "5.0.0"
description = "Python interface to MC++"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.scikit-build]
cmake.version = ">=3.18"
build.verbose = true
install.components = ["python_modules"] # Only install the python module component, not headers
wheel.packages = []

[tool.scikit-build.cmake.define]
ENABLE_TORCH = "ON"
ENABLE_HSL = "ON"
ENABLE_EXAMPLES = "ON"
MC_INTERVAL_LIBRARY = "BOOST"
PYMCPP_INSTALL_DIR = "."
